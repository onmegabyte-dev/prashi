{% include 'partials/head.html' %}
<section style="padding-top:50px"><div class="w" style="max-width:460px"><div class="card">
<h1 style="font-size:1.8rem">Change password</h1>
{% if forced %}<div class="ok" role="status">Your account uses a temporary password. Please choose your own before continuing.</div>{% endif %}
{% if error %}<div class="bad" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/account/password"><input type="hidden" name="_csrf" value="{{ csrfToken }}">
<label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password" required autofocus>
<label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
<small class="mu">At least 10 characters.</small>
<label for="confirm">Repeat new password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
<button class="btn" style="margin-top:18px;width:100%">Save password</button></form>
</div></div></section>
{% include 'partials/foot.html' %}
